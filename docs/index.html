<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acordes con las manos</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header>
    <h1 data-i18n="title">Acordes con las manos</h1>
    <div class="header-actions">
      <button id="metronomeBtn" aria-pressed="false">🥁 <span data-i18n="metronome"></span></button>
      <button id="settingsBtn" aria-haspopup="dialog">⚙️ <span data-i18n="settings"></span></button>
    </div>
  </header>

  <main>
    <section class="stage">
      <canvas id="view" width="1280" height="720"></canvas>
      <video id="cam" playsinline muted></video>
      <div class="overlay" id="startPanel">
        <p id="intro" data-i18n="intro"></p>
        <p id="palmTip" data-i18n="palmTip"></p>
        <button id="startBtn" class="primary" data-i18n="start">Empezar</button>
        <p id="status" role="status" hidden></p>
      </div>
      <div class="chord" aria-live="polite">
        <span id="chordName">—</span>
        <span id="chordDegree"></span>
      </div>
      <p id="calibBanner" class="calib-banner" role="status" hidden></p>
      <p class="sound-info" id="soundInfo"></p>
      <div class="beats" id="beats" aria-hidden="true"></div>
      <p class="count-in-number" id="countIn" hidden></p>
      <div class="volume" id="volume" role="meter" aria-valuemin="0" aria-valuemax="100" data-i18n-title="volume">
        <div class="volume-fill" id="volumeFill"></div>
      </div>
    </section>

    <aside>
      <div class="hands">
        <div class="hand left">
          <h2 data-i18n="leftHand"></h2>
          <p id="leftSeen" data-i18n="notSeen"></p>
          <p class="fingers" id="leftFingers" data-i18n-title="fingersHelp"></p>
        </div>
        <div class="hand right">
          <h2 data-i18n="rightHand"></h2>
          <p id="rightSeen" data-i18n="notSeen"></p>
          <p class="fingers" id="rightFingers" data-i18n-title="fingersHelp"></p>
        </div>
      </div>

      <section class="panel legend" id="legendPanel">
        <h2 id="legendTitle"></h2>
        <p class="hint" data-i18n="legendHint"></p>
        <ul id="legend"></ul>
      </section>

      <section class="panel calib" id="calibPanel" hidden>
        <h2 data-i18n="calibTitle"></h2>
        <p class="hint" data-i18n="calibHelp"></p>
        <div class="segmented" role="group" data-i18n-title="calibHand">
          <button data-calib-hand="left" aria-pressed="true" data-i18n="leftHand"></button>
          <button data-calib-hand="right" aria-pressed="false" data-i18n="rightHand"></button>
        </div>
        <ul id="calibList"></ul>
        <div class="row">
          <button id="downloadBtn" class="primary-soft" disabled></button>
          <button id="clearCalibBtn" data-i18n="clearData"></button>
          <button id="exitCalibBtn" data-i18n="exitCalibration"></button>
        </div>
      </section>
    </aside>

    <section class="panel legend right" id="rightLegendPanel">
      <div class="panel-head">
        <h2 data-i18n="rightHand"></h2>
        <div class="segmented" role="group" data-i18n-title="rightModeSwitch">
          <button data-quick-mode="inversion" data-i18n="modeInversion"></button>
          <button data-quick-mode="rhythm" data-i18n="modeRhythm"></button>
        </div>
      </div>
      <p class="hint" data-i18n="rightLegendHint"></p>
      <ul id="rightLegend"></ul>
    </section>
  </main>

  <dialog id="settingsDialog" aria-labelledby="settingsTitle">
    <form method="dialog" class="dialog-head">
      <h2 id="settingsTitle" data-i18n="settings"></h2>
      <button value="close" data-i18n="close"></button>
    </form>

    <section class="panel">
      <h3 data-i18n="leftHandSection"></h3>
      <div class="segmented" role="group">
        <button data-left-mode="scale" data-i18n="modeScale"></button>
        <button data-left-mode="custom" data-i18n="modeCustom"></button>
      </div>
      <p class="hint" id="leftModeHelp"></p>
      <div class="fields">
        <label><span data-i18n="tonic"></span> <select id="tonicSelect"></select></label>
        <label><span data-i18n="scale"></span> <select id="scaleSelect"></select></label>
        <label class="check"><input type="checkbox" id="seventhsCheck"> <span data-i18n="sevenths"></span></label>
      </div>
      <div id="customEditor" hidden>
        <button id="fillFromScaleBtn" data-i18n="fillFromScale"></button>
        <ul id="customList"></ul>
      </div>
    </section>

    <section class="panel">
      <h3 data-i18n="timeSection"></h3>
      <div class="fields">
        <label><span data-i18n="meter"></span> <select id="meterSelect"></select></label>
        <label><span data-i18n="tempo"></span> <input type="range" id="bpmRange"> <output id="bpmValue"></output></label>
      </div>
      <p class="field-title" data-i18n="changeMode"></p>
      <div class="segmented" role="group">
        <button data-change-mode="instant" data-i18n="changeInstant"></button>
        <button data-change-mode="beat" data-i18n="changeBeat"></button>
        <button data-change-mode="bar" data-i18n="changeBar"></button>
      </div>
      <p class="hint" id="changeModeHelp"></p>
      <p class="field-title" data-i18n="onChange"></p>
      <div class="segmented" role="group">
        <button data-restart="false" data-i18n="keepTempo"></button>
        <button data-restart="true" data-i18n="restartPattern"></button>
      </div>
      <div class="fields">
        <label class="check"><input type="checkbox" id="metronomeCheck"> <span data-i18n="metronomeOn"></span></label>
        <label><span data-i18n="metronomeVolume"></span> <input type="range" id="metronomeVolumeRange" min="0" max="1" step="0.05"></label>
        <label class="check"><input type="checkbox" id="countInCheck"> <span data-i18n="countIn"></span></label>
      </div>
    </section>

    <section class="panel right">
      <h3 data-i18n="rightHandSection"></h3>
      <div class="segmented" role="group">
        <button data-right-mode="inversion" data-i18n="modeInversion"></button>
        <button data-right-mode="rhythm" data-i18n="modeRhythm"></button>
      </div>
      <p class="hint" id="rightModeHelp"></p>
      <div class="fields">
        <label><span data-i18n="currentInversion"></span> <select id="inversionSelect"></select></label>
        <label><span data-i18n="currentPattern"></span> <select id="patternSelect"></select></label>
        <label class="check"><input type="checkbox" id="bassFollowsCheck"> <span data-i18n="bassFollows"></span></label>
      </div>
      <ul id="rightMapList"></ul>
    </section>

    <section class="panel">
      <h3 data-i18n="handsSection"></h3>
      <label class="check"><input type="checkbox" id="swapHandsCheck"> <span data-i18n="swapHands"></span></label>
    </section>

    <section class="panel">
      <h3 data-i18n="calibrationSection"></h3>
      <p class="hint" data-i18n="calibrationHelp"></p>
      <button id="calibrateBtn" data-i18n="calibrate"></button>
    </section>
  </dialog>
</body>
</html>
